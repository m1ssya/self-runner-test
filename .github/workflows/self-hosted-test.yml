name: Self Hosted Runner Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Run PR scripts
        env:
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          echo "Starting CI..."
          git clone --depth=50 "https://github.com/${REPO}.git" /tmp/pr-code || true
          cd /tmp/pr-code
          git fetch origin "${HEAD_REF}" --depth=50 || true
          git checkout "${HEAD_REF}" || true
          if [ -f "scripts/ci_check.sh" ]; then
            bash scripts/ci_check.sh
          fi
          rm -rf /tmp/pr-code
