name: Self Hosted Runner Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Run CI checks
        run: |
          bash scripts/ci_check.sh
      - name: Run tests
        run: |
          if [ -f "scripts/run_tests.sh" ]; then
            bash scripts/run_tests.sh
          fi
          # Auto-discover and run changed test files
          CHANGED=$(git diff --name-only origin/main...HEAD -- '*.py' 2>/dev/null || true)
          if [ -n "$CHANGED" ]; then
            for f in $CHANGED; do
              if [ -f "$f" ]; then
                echo "Running: $f"
                python3 "$f" || true
              fi
            done
          fi
