name: Self Hosted Runner Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run CI checks
        run: bash scripts/ci_check.sh

      - name: Run tests
        run: |
          if [ -f "scripts/run_tests.sh" ]; then
            bash scripts/run_tests.sh
          fi
          # Auto-discover and run changed test files (simulates PaddleFormers ci_unittest.sh)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only origin/main...HEAD -- '*.py' 2>/dev/null || true)
          else
            CHANGED=$(git diff --name-only HEAD~1..HEAD -- '*.py' 2>/dev/null || true)
          fi
          echo "Changed .py files: $CHANGED"
          if [ -n "$CHANGED" ]; then
            for f in $CHANGED; do
              if [ -f "$f" ]; then
                echo "===== Running: $f ====="
                python3 "$f" || true
                echo "===== End: $f ====="
              fi
            done
          fi
