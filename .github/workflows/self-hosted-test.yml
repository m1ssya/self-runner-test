name: Self Hosted Runner Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin main:refs/remotes/origin/main || true

      - name: Run CI checks
        run: bash scripts/ci_check.sh

      - name: Run tests
        run: |
          if [ -f "scripts/run_tests.sh" ]; then
            bash scripts/run_tests.sh
          fi
          # Auto-discover and run changed test files (simulates paddle ci_unittest.sh)
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            CHANGED=$(git diff --name-only "$BASE_SHA".."$HEAD_SHA" -- '*.py' 2>/dev/null || true)
          else
            CHANGED=$(git diff --name-only HEAD~1..HEAD -- '*.py' 2>/dev/null || true)
          fi
          echo "Changed .py files: $CHANGED"
          if [ -n "$CHANGED" ]; then
            for f in $CHANGED; do
              if [ -f "$f" ]; then
                echo "===== Running: $f ====="
                python3 "$f" || true
                echo "===== End: $f ====="
              fi
            done
          fi
