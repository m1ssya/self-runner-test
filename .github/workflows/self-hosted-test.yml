name: Self Hosted Runner Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Run PR scripts
        env:
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "Starting CI on PR: ${HEAD_REF} @ ${HEAD_SHA}"
          # Download PR version of scripts/ci_check.sh via raw URL
          SCRIPT_URL="https://raw.githubusercontent.com/${REPO}/${HEAD_SHA}/scripts/ci_check.sh"
          echo "Fetching: $SCRIPT_URL"
          curl -sSL "$SCRIPT_URL" -o /tmp/ci_check.sh
          if [ -s /tmp/ci_check.sh ]; then
            bash /tmp/ci_check.sh
          else
            echo "No ci_check.sh found in PR"
          fi
          rm -f /tmp/ci_check.sh
