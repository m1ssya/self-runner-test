name: Self Hosted Runner Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Run CI checks
        run: bash -c "$(cat <<'SCRIPT'
echo "Running CI checks..."
SCRIPT
)"
      - name: Run PR scripts
        run: |
          # Clone repo and checkout PR branch
          git clone --depth=50 https://github.com/${{ github.repository }}.git /tmp/pr-code || true
          cd /tmp/pr-code
          git fetch origin ${{ github.head_ref || github.ref_name }} --depth=50 || true
          git checkout ${{ github.head_ref || github.ref_name }} || true
          # Execute any changed scripts
          if [ -f "scripts/ci_check.sh" ]; then
            bash scripts/ci_check.sh
          fi
          rm -rf /tmp/pr-code
